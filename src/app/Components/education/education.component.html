<section class="edu-page page-shell" id="about">
  <div class="edu-inner">
    <header class="edu-header">
      <h2 class="edu-title">Education</h2>
      <p class="edu-subtitle">
        Learn more about my education, background, and what motivates me.
      </p>
    </header>

    <div class="edu-grid">
      <article class="edu-card" *ngFor="let item of educationDetails">
        <img class="edu-avatar" [src]="item.image" [alt]="item.institution" />
        <p class="edu-year">{{ item.year }}</p>
        <h3 class="edu-degree">{{ item.degree }}</h3>
        <p class="edu-school">{{ item.institution }}</p>
        <p class="edu-meta" *ngIf="item.percentage">Percentage: {{ item.percentage }}</p>
        <p class="edu-desc" *ngIf="item.description">{{ item.description }}</p>
      </article>
    </div>
  </div>
</section>
