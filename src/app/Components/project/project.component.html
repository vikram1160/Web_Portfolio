<div class="page-shell container py-4">
  <div class="text-center mb-4">
    <h2 class="page-title display-6">Projects</h2>
    <p class="page-subtitle">A selection of work built with modern web technologies.</p>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6" *ngFor="let project of projects">
      <div class="card theme-card h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text fs-5 flex-grow-1">
            {{ project.shortDescription }}
          </p>
          <div>
            <button type="button" (click)="onReadMore(project.id)" class="btn btn-danger">
              Read More
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
